<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="nightTitle">
  <title id="nightTitle">深粉色夜空、弯月与山丘插画</title>
  <defs>
    <linearGradient id="nightSky" x1="400" y1="0" x2="400" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3e2947"/>
      <stop offset=".45" stop-color="#70415d"/>
      <stop offset=".75" stop-color="#b96880"/>
      <stop offset="1" stop-color="#e8a3aa"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0" cy="0" r="1" gradientTransform="translate(606 146) rotate(90) scale(150)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffeccb" stop-opacity=".65"/>
      <stop offset="1" stop-color="#ffeccb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillFar" x1="400" y1="350" x2="400" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9e5d76"/>
      <stop offset="1" stop-color="#7b4562"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="400" y1="430" x2="400" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#553348"/>
      <stop offset="1" stop-color="#352237"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" seed="8"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="glow"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>

