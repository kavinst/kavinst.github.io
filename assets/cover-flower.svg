<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="flowerTitle">
  <title id="flowerTitle">奶油色背景上的粉色花朵插画</title>
  <defs>
    <linearGradient id="cream" x1="80" y1="20" x2="740" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff8ee"/>
      <stop offset=".55" stop-color="#fbece6"/>
      <stop offset="1" stop-color="#f9e2df"/>
    </linearGradient>
    <radialGradient id="petal1" cx="0" cy="0" r="1" gradientTransform="translate(0 -30) rotate(90) scale(78)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fbd0da"/>
      <stop offset="1" stop-color="#e89ab2"/>
    </radialGradient>
    <radialGradient id="petal2" cx="0" cy="0" r="1" gradientTransform="translate(0 -24) rotate(90) scale(61)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff3ee"/>
      <stop offset="1" stop-color="#f4bdca"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#b4c3a7"/>
      <stop offset="1" stop-color="#839b80"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" seed="2"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#cream)"/>
  <circle cx="704" cy="102" r="128" fill="#f7d8d1" opacity=".65"/>
  <circle cx="72" cy="572" r="149" fill="#f8d9c9" opacity=".55"/>
  <ellipse cx="364" cy="535" rx="265" ry="35" fill="#d9a9a1" opacity=".16" filter="url(#soft)"/>

  <g transform="translate(338 342)">
    <g fill="#a9b99b" stroke="#8fa186" stroke-width="1">
