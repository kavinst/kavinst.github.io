        <ellipse cx="0" cy="-59" rx="35" ry="68" transform="rotate(60)"/>
        <ellipse cx="0" cy="-59" rx="35" ry="68" transform="rotate(120)"/>
        <ellipse cx="0" cy="-59" rx="35" ry="68" transform="rotate(180)"/>
        <ellipse cx="0" cy="-59" rx="35" ry="68" transform="rotate(240)"/>
        <ellipse cx="0" cy="-59" rx="35" ry="68" transform="rotate(300)"/>
      </g>
      <g fill="url(#petal2)" transform="scale(.64) rotate(30)">
