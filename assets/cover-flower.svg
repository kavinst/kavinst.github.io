  <text x="92" y="528" font-family="Georgia, 'Times New Roman', serif" font-size="10" letter-spacing="4.5" fill="#a47a7f">SOFT DAYS · SLOW BLOOM</text>

  <rect width="800" height="600" filter="url(#grain)" opacity=".14" style="mix-blend-mode:multiply"/>
  <rect x="12" y="12" width="776" height="576" rx="2" fill="none" stroke="#fffaf4" stroke-width="1.2" opacity=".5"/>
