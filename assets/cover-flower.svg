        <ellipse cx="0" cy="-75" rx="45" ry="83" transform="rotate(72)"/>
        <ellipse cx="0" cy="-75" rx="45" ry="83" transform="rotate(144)"/>
        <ellipse cx="0" cy="-75" rx="45" ry="83" transform="rotate(216)"/>
        <ellipse cx="0" cy="-75" rx="45" ry="83" transform="rotate(288)"/>
      </g>
