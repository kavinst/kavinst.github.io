  <g opacity=".8">
    <path d="M118 158c12-9 25-10 39-3" fill="none" stroke="#c69b9b" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M658 454c10-8 21-9 33-3" fill="none" stroke="#c69b9b" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="707" cy="347" r="3" fill="#e7b4b9"/>
    <circle cx="728" cy="366" r="1.8" fill="#e7b4b9"/>
    <circle cx="687" cy="376" r="1.5" fill="#e7b4b9"/>
    <circle cx="626" cy="131" r="2.2" fill="#d7a0a8"/>
