      <g fill="#f9d6df">
        <ellipse cx="0" cy="-57" rx="33" ry="65"/>
        <ellipse cx="0" cy="-57" rx="33" ry="65" transform="rotate(72)"/>
        <ellipse cx="0" cy="-57" rx="33" ry="65" transform="rotate(144)"/>
        <ellipse cx="0" cy="-57" rx="33" ry="65" transform="rotate(216)"/>
        <ellipse cx="0" cy="-57" rx="33" ry="65" transform="rotate(288)"/>
