      <circle cx="280" cy="128" r="2.5" fill="#c68498"/>
    </g>

    <text x="280" y="173" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" letter-spacing="5.4" fill="#a96e7f">A GIRL IN BLOOM</text>

    <text x="280" y="430" text-anchor="middle" font-family="'Songti SC', 'STSong', 'SimSun', Georgia, serif" font-size="176" font-weight="700" fill="#b95c78">蕊</text>

    <path d="M173 461h214" stroke="#e2b3bf" stroke-width="1"/>
    <circle cx="280" cy="461" r="3.4" fill="#f3b7c6" stroke="#fffaf7" stroke-width="2"/>

    <text x="280" y="503" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" letter-spacing="8" fill="#986571">HU XINRUI</text>
