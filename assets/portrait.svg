<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 700" role="img" aria-labelledby="portraitTitle portraitDesc">
  <title id="portraitTitle">胡欣蕊的插画肖像</title>
  <desc id="portraitDesc">奶油色拱门中的粉色花卉、蕊字与英文名字组成的插画肖像。</desc>
  <defs>
    <linearGradient id="paper" x1="48" y1="20" x2="520" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fceef1"/>
      <stop offset=".52" stop-color="#fae3e8"/>
      <stop offset="1" stop-color="#f5d9df"/>
    </linearGradient>
    <linearGradient id="arch" x1="280" y1="120" x2="280" y2="650" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffcf8"/>
      <stop offset="1" stop-color="#fff7f1"/>
    </linearGradient>
    <radialGradient id="blush" cx="0" cy="0" r="1" gradientTransform="translate(280 410) rotate(90) scale(210)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f9cfd9" stop-opacity=".8"/>
      <stop offset="1" stop-color="#f9cfd9" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#9f526b" flood-opacity=".17"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" seed="9" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
    </filter>
    <clipPath id="portraitClip"><rect width="560" height="700" rx="0"/></clipPath>
  </defs>

  <g clip-path="url(#portraitClip)">
    <rect width="560" height="700" fill="url(#paper)"/>
    <circle cx="486" cy="80" r="138" fill="#f5c5d1" opacity=".7"/>
    <circle cx="38" cy="622" r="168" fill="#f8d4c2" opacity=".72"/>
    <circle cx="520" cy="606" r="104" fill="#eadcf7" opacity=".62"/>

    <g opacity=".7" fill="none">
      <path d="M22 144c18-8 36-8 54 0M22 160c18-8 36-8 54 0M484 492c18-8 36-8 54 0M484 508c18-8 36-8 54 0" stroke="#cf93a5" stroke-width="1.2" stroke-linecap="round"/>
    </g>

    <path d="M78 660V242c0-114 90-206 202-206s202 92 202 206v418Z" fill="url(#arch)" stroke="#e8b7c3" stroke-width="1.5" filter="url(#softShadow)"/>
    <path d="M98 660V245c0-102 81-184 182-184s182 82 182 184v415Z" fill="none" stroke="#efcbd3" stroke-width="1" stroke-dasharray="2 8"/>
    <ellipse cx="280" cy="395" rx="164" ry="175" fill="url(#blush)"/>

    <g opacity=".72" stroke="#c68498" stroke-width="1.2" fill="none">
