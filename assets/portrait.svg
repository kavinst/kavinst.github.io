      <path d="M430 421c-12-16-12-30 0-43 13 13 13 27 0 43Z" fill="#f1adc0"/>
      <path d="M430 421c18-10 32-9 42 3-14 11-28 10-42-3Z" fill="#f7c9d4"/>
      <path d="M430 421c-17-8-30-6-40 6 13 10 27 8 40-6Z" fill="#f5b9c8"/>
      <circle cx="430" cy="420" r="5" fill="#fff4e2"/>
      <path d="M430 424c-2 15-1 30 4 45" stroke="#a4b697" stroke-width="1.6" fill="none"/>
