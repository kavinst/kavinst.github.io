      <path d="M356 216c2.4 7.7 5.7 11 13.4 13.4-7.7 2.4-11 5.7-13.4 13.4-2.4-7.7-5.7-11-13.4-13.4 7.7-2.4 11-5.7 13.4-13.4Z"/>
      <path d="M221 200c1.7 5.4 4 7.7 9.4 9.4-5.4 1.7-7.7 4-9.4 9.4-1.7-5.4-4-7.7-9.4-9.4 5.4-1.7 7.7-4 9.4-9.4Z" opacity=".6"/>
    </g>

    <g transform="translate(448 206) rotate(13)" opacity=".55">
      <rect x="-25" y="-15" width="50" height="31" rx="4" fill="#fffaf5" stroke="#d8a7b4"/>
      <path d="M-9 0h18M-9 7h11" stroke="#d8a7b4" stroke-width="1" stroke-linecap="round"/>
    </g>

    <rect width="560" height="700" filter="url(#grain)" opacity=".11" style="mix-blend-mode:multiply"/>
    <rect x="14" y="14" width="532" height="672" rx="2" fill="none" stroke="#fffaf7" stroke-width="1.4" opacity=".8"/>
