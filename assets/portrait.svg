      <path d="M441 578c22-6 35-18 41-36-21 0-35 10-41 36Z" fill="#b8c7ab"/>
      <path d="M425 541c-23-9-36-25-39-46 22 4 36 17 39 46Z" fill="#a8b99a"/>
